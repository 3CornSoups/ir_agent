  - id: music-video-subtitle
    title: Lyric / MV subtitle
    overlay: overlays/music-video-subtitle.txt
    description: >
      Music video with on-screen lyrics or beat-synced typography. Vocal /
      typography / visual layers.
    triggers:
      - 歌词
      - 卡点
      - MV
      - 字幕 MV
