      - C4D
      - squash and stretch
      - 定格感三维

  - id: papercraft-stop-motion
    title: Papercraft stop-motion
    overlay: overlays/papercraft-stop-motion.txt
    description: >
      Papercraft / paper-toy stop-motion explainer. Craft materials, stepped
      motion, character and set continuity.
    triggers:
      - 纸艺
      - 定格
      - 纸模型
      - 手工纸
      - papercraft
      - stop-motion
      - stop motion
