# 风格 skill 目录：前置路由只看 id/description/triggers(cues)，命中后再读 overlay。
# 底座 h3-prompt-writing 始终在 format 阶段加载，不走本表。
#
# origin:
#   official   — 压缩自 MiniMax 官方题材 skill（默认）
#   community  — 非官方 / 社区 skill；须填 upstream（GitHub 目录或 SKILL.md URL）
#
# 接入社区 skill 步骤：
# 1. 读上游 SKILL.md / references，只提取「写法」；去掉 Hub 工具、确认门、出片、Seedance 专属语法。
# 2. 复制 overlays/_TEMPLATE_community.txt → overlays/<id>.txt，填机制/节拍/约束。
# 3. 对齐本仓库硬规则：默认单镜（除非意图要求分镜）；non_diegetic_music 默认有配乐（除非意图要求 N/A）。
# 4. 在本文件 skills: 下追加条目（origin: community + upstream），triggers 作 LLM cues。
# 5. 跑：pytest -q test/test_skill_router.py
# 6. 试跑：--skill <id> --skill-router off，确认 run.json → skills.style_detail
#
# 路由：LLM 按 description/cues 给每条 skill 0~1 分，取 top1；
# 若 top1 < llm_score_threshold 则不选任何风格 skill（无关键词预筛）。

max_skills: 2
llm_score_threshold: 0.6

skills:
