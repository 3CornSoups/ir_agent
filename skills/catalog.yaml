# 风格 skill 目录：前置路由只看 id/description/triggers，命中后再读 overlay。
# 底座 h3-prompt-writing 始终在 format 阶段加载，不走本表。
# 写法压缩自官方 MiniMax-H3 skills 与 sjh00 分镜版，去掉 Hub/确认门/出片工具。

max_skills: 2

skills:
  - id: brand-promo
    title: Brand promo
    overlay: overlays/brand-promo.txt
    description: >
      Brand / product / website / app launch or campaign short. Logo lockup,
      official claims, CTA, product proof, SaaS capability reel.
    triggers:
      - 品牌
      - 宣传片
      - 广告片
      - 发布会
      - 官网
      - 卖点
      - 号召
      - CTA
      - brand promo
      - promotional
      - product launch
      - logo lockup
      - call to action
      - campaign

  - id: minimalist-product-ad
    title: Minimalist product ad
    overlay: overlays/minimalist-product-ad.txt
    description: >
      Apple-keynote / minimal negative-space product film. Preserve product
      body color; single-line on-screen copy; no grid or split-screen.
    triggers:
      - 极简
      - 苹果风
      - 产品广告
      - 产品片
      - 留白
      - Apple
      - keynote
      - minimalist product
      - product ad
      - product film
      - negative space

  - id: 3d-animation
    title: Stylized 3D animation
    overlay: overlays/3d-animation.txt
    description: >
      Stylized 3D cartoon short (Pixar/C4D look), character lock, per-second
      shot table. Not photoreal live-action.
    triggers:
      - 三维动画
      - 3D动画
      - 3D 动画
      - 卡通短片
      - 皮克斯
      - Pixar
      - stylized 3D
